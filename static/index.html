<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>P2 Document Retrieval</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
  <div class="container">
    <h1>Document Retrieval Comparison</h1>
    <p class="subtitle">
      Semantic vs Re-Rank vs Hybrid vs Hybrid + Re-Rank
    </p>

    <!-- Search box -->
    <div class="search-box">
      <input
        id="query"
        type="text"
        placeholder="Enter your query (e.g., privacy risks, neural networks)"
      />
      <select id="topK">
        <option value="5" selected>Top 5</option>
        <option value="8">Top 8</option>
        <option value="10">Top 10</option>
      </select>
      <button onclick="runSearch()">Search</button>
    </div>

    <!-- Results -->
    <div id="results" class="results-grid"></div>
  </div>

<script>
async function postSearch(payload) {
  const r = await fetch("/search", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  if (!r.ok) throw new Error("Search failed");
  return (await r.json()).results || [];
}

function formatResult(r, mode) {
  const md = r.metadata || {};
  const name = md.filename || r.id;

  let scoreLine = "";
  if (mode === "semantic") {
    scoreLine = `dist: ${r.distance?.toFixed(3)}`;
  } else if (mode === "rerank") {
    scoreLine = `dist: ${r.distance?.toFixed(3)} | rerank: ${r.rerank_score?.toFixed(3)}`;
  } else if (mode === "hybrid") {
    scoreLine = `rrf: ${r.rrf_score?.toFixed(3)} | bm25: ${r.bm25_score?.toFixed(3) ?? "-"}`;
  } else {
    scoreLine =
      `rrf: ${r.rrf_score?.toFixed(3)} | bm25: ${r.bm25_score?.toFixed(3) ?? "-"} | rerank: ${r.rerank_score?.toFixed(3)}`;
  }

  return `
    <div class="result">
      <div class="file">${name}</div>
      <div class="score">${scoreLine}</div>
      <div class="text">${(r.text || "").slice(0, 300)}...</div>
    </div>
  `;
}

function renderColumn(title, mode, results) {
  return `
    <div class="column">
      <h3>${title}</h3>
      ${results.length === 0 ? "<p class='empty'>No results</p>" :
        results.map(r => formatResult(r, mode)).join("")}
    </div>
  `;
}

async function runSearch() {
  const query = document.getElementById("query").value.trim();
  const n = Number(document.getElementById("topK").value);
  if (!query) return;

  document.getElementById("results").innerHTML = "<p>Searching…</p>";

  try {
    const [
      semantic,
      rerank,
      hybrid,
      hybridRerank
    ] = await Promise.all([
      postSearch({ query, n_results: n, use_hybrid: false, use_reranking: false }),
      postSearch({ query, n_results: n, use_hybrid: false, use_reranking: true }),
      postSearch({ query, n_results: n, use_hybrid: true,  use_reranking: false }),
      postSearch({ query, n_results: n, use_hybrid: true,  use_reranking: true }),
    ]);

    document.getElementById("results").innerHTML = `
      ${renderColumn("Semantic Only", "semantic", semantic)}
      ${renderColumn("Retrieve + Re-Rank", "rerank", rerank)}
      ${renderColumn("Hybrid (BM25 + Semantic)", "hybrid", hybrid)}
      ${renderColumn("Hybrid + Re-Rank", "hybrid_rerank", hybridRerank)}
    `;
  } catch (e) {
    document.getElementById("results").innerHTML =
      "<p class='error'>Search failed</p>";
  }
}
</script>
</body>
</html>
