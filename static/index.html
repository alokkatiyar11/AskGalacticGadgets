<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Galactic Gadgets AI Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-theme="light">
  <div class="app-shell with-sidebar">
    <aside class="sidebar">
      <div class="sidebar-header">
        <button id="newChat" class="btn btn-primary sidebar-full-btn" type="button">+ New Chat</button>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title-row">
          <h3>History</h3>
        </div>
        <div id="chatList" class="chat-list"></div>
      </div>

      <div class="sidebar-section about-panel">
        <h3>About</h3>
        <div id="aboutInfo" class="about-info">
          <p>Loading...</p>
        </div>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-icon">🚀</div>
          <div>
            <h1>Galactic Gadgets AI Assistant</h1>
            <p>Ask product, troubleshooting, and documentation questions</p>
          </div>
        </div>

        <div class="topbar-actions">
          <button id="themeToggle" class="btn btn-secondary" type="button">Toggle Theme</button>
          <button id="clearChat" class="btn btn-secondary" type="button">Clear</button>
          <button id="deleteChat" class="btn btn-secondary" type="button">Delete Chat</button>
          <button id="exportChat" class="btn btn-primary" type="button">Export</button>
        </div>
      </header>

      <section class="control-panel">
        <div class="control-card">
          <label for="temperatureSlider">Temperature</label>
          <div class="slider-row">
            <input id="temperatureSlider" type="range" min="0" max="1" step="0.1" value="0.7" />
            <span id="temperatureValue" class="slider-value">0.7</span>
          </div>
        </div>

        <div class="control-card">
          <label for="contextSlider">Context Documents</label>
          <div class="slider-row">
            <input id="contextSlider" type="range" min="1" max="10" step="1" value="3" />
            <span id="contextValue" class="slider-value">3</span>
          </div>
        </div>
      </section>

      <main class="chat-stage">
        <div id="chatHistory" class="chat-history">
          <div class="empty-state" id="emptyState">
            <div class="empty-state-icon">💬</div>
            <h2>Start a conversation</h2>
            <p>Ask about product specifications, setup guides, or troubleshooting steps.</p>
          </div>
        </div>

        <div id="typingIndicator" class="typing-indicator hidden">
          <div class="typing-bubble">
            <span></span><span></span><span></span>
          </div>
          <span>Assistant is typing...</span>
        </div>
      </main>

      <form id="chatForm" class="composer">
        <div class="composer-inner">
          <textarea
            id="questionInput"
            rows="1"
            placeholder="Message Galactic Gadgets AI Assistant..."
          ></textarea>
          <button class="btn btn-primary send-btn" type="submit">Send</button>
        </div>
        <div class="composer-hint">Enter to send • Shift+Enter for newline</div>
      </form>
    </div>
  </div>

  <script src="/chat.js"></script>
</body>
</html>
