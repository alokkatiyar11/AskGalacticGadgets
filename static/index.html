<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2 Document Retrieval System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="top-nav">
  <a href="/" class="active">Search Interface</a>
  <a href="/playground.html">🧪 Playground</a>
</nav>
<div class="main-container">
    <!-- LEFT PANEL: Question History -->
    <div class="panel history-panel">
        <div class="panel-header">
            <h2>History</h2>
            <button class="btn-small" onclick="clearHistory()">Clear</button>
        </div>
        <div id="historyList" class="history-list">
            <div class="empty-state">No searches yet</div>
        </div>
    </div>

    <!-- CENTER PANEL: Question Input -->
    <div class="panel search-panel">
        <h1>Lab 5: Document Retrieval</h1>

        <!-- Health Section (kept from original) -->
        <div class="health-section">
            <button id="healthButton" onclick="displayHealth()">Check Health</button>
            <div id="health-status">Click to check server status</div>
        </div>

        <!-- Search Input -->
        <div class="search-section">
            <textarea
                id="queryInput"
                placeholder="Enter your search query..."
                rows="3"
            ></textarea>

            <div class="search-options">
  <label class="option">
    <input type="checkbox" id="useHybrid" checked>
    Hybrid Search
  </label>

  <label class="option">
    <input type="checkbox" id="useReranking" checked>
    Reranking
  </label>

  <label class="option">
    Results:
    <input type="number" id="numResults" min="1" max="20" value="5">
  </label>
</div>

            <button id="searchButton" onclick="performSearch()">Search</button>
        </div>

        <div class="metrics-section">
  <h3>Metrics</h3>
  <div class="metrics-grid">
    <div class="metric">
      <div class="metric-label">Method</div>
      <div id="methodValue" class="metric-value">—</div>
    </div>
    <div class="metric">
      <div class="metric-label">Results</div>
      <div id="countValue" class="metric-value">—</div>
    </div>
    <div class="metric">
      <div class="metric-label">Response Time</div>
      <div id="timeValue" class="metric-value">—</div>
    </div>
  </div>
</div>
    </div>

    <!-- RIGHT PANEL: Results Display -->
    <div class="panel results-panel">
        <div class="panel-header">
            <h2>Results</h2>
            <button class="btn-small" onclick="exportResults()">Export JSON</button>
        </div>
        <div id="results" class="results-list">
            <div class="empty-state">Enter a query to search</div>
        </div>
    </div>
</div>

<script src="search.js"></script>
</body>
</html>
